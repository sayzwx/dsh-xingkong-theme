# 收录用条目（PR 到 awesome-dsh-plugin 的 data/plugins/ 下）
#
# 目标文件：awesome-dsh-plugin/awesome-dsh-plugin → data/plugins/sayzwx__dsh-xingkong-theme.yml
#   （文件名规则：<owner>__<repo>.yml，owner/repo 与仓库完全一致）
#
# ⚠️ 这一版换成了**独立仓库** `sayzwx/dsh-xingkong-theme`（原先是
# DSH-desktop 的子目录）。所以：
#   · 文件名从 sayzwx__DSH-desktop.yml 改成 sayzwx__dsh-xingkong-theme.yml
#   · 市场里会是一条**新条目**，不是对旧条目的更新 —— 这是换仓库的必然结果。
#     旧条目需要一并删除或改名，否则列表里会留下一个指向旧路径的死条目。
#   · 若之后又搬回 monorepo，文件名要跟着改回去（名字即身份）。
#
# 规则要点（来自 contributing.md）：
#   · 一个 PR 只改一个文件；README 由脚本生成，**不要手工编辑**
#   · category 必须用 theme（会自动进 dsh-market 的「主题 Tab」，可一键安装/切换/卸载）
#   · 只有 description.en 必填；zh 可选
#   · ⚠️ 描述里含 ": " 必须加引号，否则 YAML 会把冒号当键值分隔
#   · 描述只说功能、不带营销词；**必须属实**（评审会对着代码核）
#   · 仓库需声明 dsh.bundle ✓（本包根目录的 package.json 有）并加 dsh-plugin topic
#   · 仓库需创建满 1 天、有真实可运行代码
#
# screenshots 字段（依据 market 前端 client.js 的实际消费方式）：
#   · 卡片上的缩略图**只认这个字段**；没有它，卡片会显示「正在查找预览…」
#   · README 里 `![]()` 的图只在安装详情弹窗里出现（只有弹窗才去抓 README）
#   · 必须 https，域名在白名单内：raw.githubusercontent.com /
#     user-images.githubusercontent.com / camo.githubusercontent.com / github.com
#   · .svg 会被丢弃（那是 logo / 徽章的形状），最多 6 张
#   · 用 HEAD 而非分支名或 tag：HEAD 永远指向默认分支，不会腐烂
#
# tarball 字段（预编译包，市场会优先给下载链接而不是源码构建命令）：
#   · 必须是该仓库 GitHub Release 托管的 https .tgz
#   · 标签钉在具体版本上（不是 latest/download）—— latest/download 只在请求时
#     解析 latest、文件名照字面取，文件名带版本号就会在下一版静默 404
#   · ⚠️ 提交顺序：先建 Release 并上传 tgz，再提本条目的 PR，否则链接在评审期间是死的
#
# ---- 以下为可提交内容（复制到目标文件即可）----
url: https://github.com/sayzwx/dsh-xingkong-theme
name: sayzwx/dsh-xingkong-theme
